<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Summarizer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
        h1 { text-align: center; color: #333; }
        textarea { width: 100%; height: 180px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        button { display: block; width: 100%; padding: 12px; background-color: #0066cc; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button:hover { background-color: #0052a3; }
        .error { background-color: #ffe6e6; color: #d9534f; padding: 12px; border-radius: 6px; margin-top: 15px; border: 1px solid #f5c6cb; }
        .summary-box { background-color: #f4f6f8; padding: 18px; border-left: 5px solid #0066cc; margin-top: 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>AI Text Summarizer</h1>
    <form method="POST">
        <label for="text"><strong>Enter Text to Summarize:</strong></label>
        <textarea name="text" id="text" placeholder="Paste your article or long text here..." required>{{ text }}</textarea>
        <button type="submit">Generate Summary</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if summary %}
        <div class="summary-box">
            <h3>Summary:</h3>
            <p>{{ summary }}</p>
        </div>
    {% endif %}
</body>
</html>
